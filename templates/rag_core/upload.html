{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2 style="color: var(--primary); margin-top: 0;">Upload Your CV</h2>
    <p>Upload your PDF or DOCX resume to start building your AI Career Co-pilot. It will automatically be linked to your account (<strong>{{ user.username }}</strong>).</p>

    {% if error %}
    <div style="color: #721c24; background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="font-weight: 500; display: block; margin-bottom: 8px;">CV File (PDF/DOCX):</label>
            <input type="file" name="cv_file" accept=".pdf,.docx" required>
        </div>
        <button type="submit" class="btn btn-primary">Upload and Process</button>
    </form>
</div>
{% endblock %}
