{% extends 'base.html' %}

{% block content %}
<div class="card slide-up" style="max-width: 400px; margin: auto; padding: 30px; text-align: center;">
    <h2 style="color: var(--secondary); margin-bottom: 20px;">Password Reset Complete</h2>
    <p style="color: var(--text); font-size: 1.1em; margin-bottom: 30px;">
        Your password has been set successfully. You may go ahead and log in now.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">Log In</a>
</div>
{% endblock %}
