{% extends 'base.html' %}

{% block content %}
<div class="card fade-in" style="max-width: 400px; margin: auto; padding: 30px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Log In</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'password_reset' %}" style="font-size: 0.9em; color: var(--primary);">Forgot Password?</a><br><br>
        <p style="font-size: 0.9em;">Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600;">Sign Up</a></p>
    </div>
</div>
{% endblock %}
