{% extends 'base.html' %}

{% block content %}
<div class="card slide-up" style="max-width: 400px; margin: auto; padding: 30px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Reset Password</h2>
    <p style="text-align: center; color: var(--text-light); font-size: 0.9em; margin-bottom: 20px;">
        Enter your email address below, and we'll email instructions for setting a new one.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
